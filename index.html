<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>人狼ゲーム 完全版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;text-align:center}
.hidden{display:none}
.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px}
button{padding:10px 20px;font-size:16px;border:none;border-radius:10px;background:#22c55e;color:#000;margin:5px}
.player{background:#334155;margin:5px;padding:8px;border-radius:8px;cursor:pointer}
.dead{opacity:.4;text-decoration:line-through}
.select{outline:3px solid #22c55e}
</style>
</head>
<body>

<h1>🐺 人狼ゲーム</h1>

<!-- 設定 -->
<div id="setup" class="card">
<h2>設定</h2>
人数 <input id="pc" type="number" value="8" min="3"><br><br>
昼制限(秒) <input id="dayLimit" type="number" value="60"><br><br>

<label>
<input type="checkbox" id="adv" onchange="advBox.classList.toggle('hidden',!this.checked)">
上級役職ON
</label>
<hr>
🐺人狼 <input id="wolf" type="number" value="1">
🔮占い師 <input id="seer" type="number" value="1">
🛡騎士 <input id="knight" type="number" value="1">
💃踊り子 <input id="dancer" type="number" value="1">
<div id="advBox" class="hidden">
🦊妖狐 <input id="fox" type="number" value="0">
</div>
<br><br>
<button onclick="start()">開始</button>
</div>

<!-- 共通：本人確認 -->
<div id="confirmBox" class="card hidden">
<h2 id="confirmText"></h2>
<button onclick="confirmYes()">はい</button>
<button onclick="confirmNo()">いいえ</button>
</div>

<!-- 共通：内容表示 -->
<div id="privateBox" class="card hidden">
<h2 id="privateTitle"></h2>
<p id="privateContent"></p>
<button onclick="privateOK()">OK</button>
</div>

<!-- ゲーム画面 -->
<div id="game" class="card hidden">
<h2 id="phaseEl"></h2>
<p id="info"></p>
<div id="players"></div>
<button onclick="confirm()">決定</button>
</div>

<script>
let players=[],idx=0,phase="",timer,time;
let votes={},night={},protectedId=null;
let queue=[],currentAction=null;

const playersDiv=document.getElementById("players");
const phaseEl=document.getElementById("phaseEl");
const info=document.getElementById("info");

/* ===== 開始 ===== */
function start(){
  let roles=[],n=+pc.value;
  const add=(id,r)=>{for(let i=0;i<+document.getElementById(id).value;i++)roles.push(r);}
  add("wolf","人狼"); add("seer","占い師");
  add("knight","騎士"); add("dancer","踊り子");
  if(adv.checked)add("fox","妖狐");
  while(roles.length<n)roles.push("村人");
  roles.sort(()=>Math.random()-.5);

  players=roles.map((r,i)=>({id:i,name:"P"+(i+1),role:r,alive:true,used:false}));
  setup.classList.add("hidden");
  queue=[];
  players.forEach(p=>{
    queue.push(()=>showPrivate(p, "あなたの役職", p.role));
  });
  nextQueue();
}

/* ===== 共通確認 ===== */
function showConfirm(text,yes){
  confirmText.textContent=text;
  confirmBox.classList.remove("hidden");
  currentAction=yes;
}
function confirmYes(){
  confirmBox.classList.add("hidden");
  currentAction();
}
function confirmNo(){
  alert("正しい人に渡してください");
}

/* ===== 個別表示 ===== */
function showPrivate(player,title,content){
  showConfirm(`あなたは ${player.name} ですか？`,()=>{
    privateTitle.textContent=title;
    privateContent.textContent=content;
    privateBox.classList.remove("hidden");
    currentAction=()=>{
      privateBox.classList.add("hidden");
      nextQueue();
    };
  });
}
function privateOK(){ currentAction(); }

/* ===== キュー処理 ===== */
function nextQueue(){
  if(queue.length>0)queue.shift()();
  else startDay();
}

/* ===== 昼 ===== */
function startDay(){
  game.classList.remove("hidden");
  phase="昼";
  phaseEl.textContent="昼（投票）";
  votes={};
  render();
  time=+dayLimit.value;
  clearInterval(timer);
  timer=setInterval(()=>{
    info.textContent="残り "+time+" 秒";
    if(--time<0)confirm();
  },1000);
}

/* ===== 夜 ===== */
function startNight(){
  phase="夜";
  phaseEl.textContent="夜";
  night={}; protectedId=null;
  queue=[];
  players.filter(p=>p.alive).forEach(p=>{
    if(["人狼","占い師","騎士"].includes(p.role)){
      queue.push(()=>nightAction(p));
    }
  });
  nextQueue();
}

function nightAction(p){
  showPrivate(p,"夜の行動",p.role+" の行動を行ってください");
  render(true,p);
}

/* ===== 表示 ===== */
function render(select=false,actor=null){
  playersDiv.innerHTML="";
  players.forEach(p=>{
    const d=document.createElement("div");
    d.className="player"+(!p.alive?" dead":"");
    d.textContent=p.name;
    if(select&&p.alive&&p!==actor){
      d.onclick=()=>{
        document.querySelectorAll(".select").forEach(e=>e.classList.remove("select"));
        d.classList.add("select");
        night[actor.id]=p.id;
      };
    }
    playersDiv.appendChild(d);
  });
}

/* ===== 決定 ===== */
function confirm(){
  if(phase==="昼"){
    clearInterval(timer);
    let t=Object.keys(votes)[0];
    if(t!==undefined)players[t].alive=false;
    startNight();
  }
}

/* ===== 勝利 ===== */
function showResult(title){
  queue=[];
  players.forEach(p=>{
    queue.push(()=>showPrivate(p,"結果",title));
  });
  nextQueue();
}
</script>
</body>
</html>
