<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>人狼ゲーム 完全版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;text-align:center}
.card{background:#1e293b;margin:10px auto;padding:15px;border-radius:12px;max-width:480px}
button,select,input{font-size:16px;padding:8px;margin:5px}
.hidden{display:none}
.timer{font-size:20px;color:#38bdf8}
.pauseBtn{background:#334155;color:#fff;border:none;border-radius:8px}
</style>
</head>
<body>

<h1>🐺 人狼ゲーム</h1>
<div class="timer" id="timer"></div>
<button class="pauseBtn" onclick="togglePause()" id="pauseBtn">⏸ 一時停止</button>

<div id="setup" class="card">
  <h2>ゲーム設定</h2>

  夜の制限時間（秒）
  <input type="number" id="nightInput" value="30" min="5"><br>

  昼の制限時間（秒）
  <input type="number" id="dayInput" value="60" min="5"><br><hr>

  プレイヤー人数
  <input type="number" id="count" min="3" value="5">
  <button onclick="makeNames()">名前入力</button>
  <div id="names"></div>

  <button onclick="start()">ゲーム開始</button>
</div>

<div id="confirm" class="card hidden">
  <h2 id="cname"></h2>
  <button onclick="showRole()">私はこの人です</button>
</div>

<div id="role" class="card hidden">
  <h2 id="rname"></h2>
  <p id="rtext"></p>
  <button onclick="nextRole()">次へ</button>
</div>

<script>
let NIGHT_TIME=30,DAY_TIME=60;
let timerInt,timeLeft,isPaused=false;

let players=[],roles=[],alive=[],usedDance=[];
let idx=0;

/* ==== タイマー ==== */
function startTimer(sec){
  clearInterval(timerInt);
  timeLeft=sec;
  timer.textContent=`残り時間：${timeLeft}s`;
  timerInt=setInterval(()=>{
    if(isPaused) return;
    timeLeft--;
    timer.textContent=`残り時間：${timeLeft}s`;
    if(timeLeft<=0) clearInterval(timerInt);
  },1000);
}
function togglePause(){
  isPaused=!isPaused;
  pauseBtn.textContent=isPaused?"▶ 再開":"⏸ 一時停止";
}

/* ==== セットアップ ==== */
function makeNames(){
  names.innerHTML="";
  for(let i=0;i<count.value;i++){
    names.innerHTML+=`<input placeholder="プレイヤー${i+1}"><br>`;
  }
}

function start(){
  idx=0; // ← ★重要：必ずリセット

  NIGHT_TIME=Math.max(5,Number(nightInput.value)||30);
  DAY_TIME=Math.max(5,Number(dayInput.value)||60);

  const inputs=[...names.querySelectorAll("input")];
  if(inputs.length < count.value){
    alert("先に『名前入力』を押してください");
    return;
  }

  players=inputs.map((i,n)=>i.value||`プレイヤー${n+1}`);

  roles=["人狼","占い師","狩人","霊能者","踊り子","妖狐"];
  while(roles.length<players.length) roles.push("村人");
  roles=roles.slice(0,players.length).sort(()=>Math.random()-0.5);

  alive=Array(players.length).fill(true);
  usedDance=Array(players.length).fill(false);

  setup.classList.add("hidden");
  confirm.classList.remove("hidden");
  cname.textContent=players[idx];
}

/* ==== 役職確認 ==== */
function showRole(){
  confirm.classList.add("hidden");
  role.classList.remove("hidden");
  rname.textContent=players[idx];
  rtext.textContent="あなたの役職は【"+roles[idx]+"】です";
}

function nextRole(){
  role.classList.add("hidden");
  idx++;
  if(idx<players.length){
    confirm.classList.remove("hidden");
    cname.textContent=players[idx];
  }else{
    alert("全員の役職確認が終わりました！");
  }
}
</script>
</body>
</html>
