<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>人狼ゲーム 完全版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0f172a;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
}
.card{
  background:#1e293b;
  margin:10px auto;
  padding:15px;
  border-radius:14px;
  max-width:420px;
}
.hidden{display:none}
button{
  width:90%;
  max-width:300px;
  padding:14px;
  font-size:17px;
  border:none;
  border-radius:14px;
  background:#22c55e;
  color:#000;
  margin:8px auto;
}
button:disabled{
  background:#475569;
  color:#aaa;
}
input{
  width:80px;
  font-size:16px;
}
.player{
  background:#334155;
  margin:6px auto;
  padding:10px;
  border-radius:10px;
  max-width:300px;
}
.dead{opacity:.4;text-decoration:line-through}
.select{outline:3px solid #22c55e}
.warning{color:#f87171;font-weight:bold}
</style>
</head>
<body>

<h1>🐺 人狼ゲーム</h1>

<!-- 設定 -->
<div id="setup" class="card">
<h2>設定</h2>

人数<br>
<input id="pc" type="number" value="8" min="3"><br><br>

昼制限（秒）<br>
<input id="dayLimit" type="number" value="60"><br><br>

<label>
<input type="checkbox" id="adv"
 onchange="advBox.classList.toggle('hidden',!this.checked);updateVillagers()">
上級役職ON
</label>

<hr>

🐺 人狼 <input id="wolf" type="number" value="1"><br>
🔮 占い師 <input id="seer" type="number" value="1"><br>
🛡 騎士 <input id="knight" type="number" value="1"><br>
💃 踊り子 <input id="dancer" type="number" value="1"><br>

<div id="advBox" class="hidden">
🦊 妖狐 <input id="fox" type="number" value="0"><br>
</div>

<hr>
<div id="villagerCount">👤 村人：0 人（自動）</div>
<div id="warn" class="warning hidden">⚠ 役職数が人数を超えています</div>

<br>
<button id="startBtn" onclick="start()">開始</button>
</div>

<!-- 本人確認 -->
<div id="confirmBox" class="card hidden">
<h2 id="confirmText"></h2>
<button onclick="confirmYes()">はい</button>
<button onclick="confirmNo()">いいえ</button>
</div>

<!-- 個別表示 -->
<div id="privateBox" class="card hidden">
<h2 id="privateTitle"></h2>
<p id="privateContent"></p>
<button onclick="privateOK()">OK</button>
</div>

<!-- ゲーム -->
<div id="game" class="card hidden">
<h2 id="phaseEl"></h2>
<p id="info"></p>
<div id="players"></div>
<button onclick="confirm()">決定</button>
</div>

<!-- 勝利 -->
<div id="result" class="card hidden">
<h2 id="resultText"></h2>
<button onclick="location.reload()">役職選択に戻る</button>
</div>

<script>
let players=[],phase="",queue=[],currentAction=null;
let votes={},night={},protectedId=null,selected=null;

const playersDiv=document.getElementById("players");

/* ===== 村人自動計算 & 超過チェック ===== */
function updateVillagers(){
 let total=+pc.value;
 let used=
  +wolf.value+
  +seer.value+
  +knight.value+
  +dancer.value+
  (adv.checked?+fox.value:0);

 let villagers=total-used;
 villagerCount.textContent=
  `👤 村人：${Math.max(0,villagers)} 人（自動）`;

 if(villagers<0){
  warn.classList.remove("hidden");
  startBtn.disabled=true;
 }else{
  warn.classList.add("hidden");
  startBtn.disabled=false;
 }
}

document.querySelectorAll("#setup input").forEach(i=>{
 i.addEventListener("input",updateVillagers);
});
updateVillagers();

/* ===== 開始 ===== */
function start(){
 let roles=[],n=+pc.value;
 const add=(id,r)=>{for(let i=0;i<+document.getElementById(id).value;i++)roles.push(r);}
 add("wolf","人狼");add("seer","占い師");add("knight","騎士");add("dancer","踊り子");
 if(adv.checked)add("fox","妖狐");
 while(roles.length<n)roles.push("村人");
 roles.sort(()=>Math.random()-.5);
 players=roles.map((r,i)=>({id:i,name:"P"+(i+1),role:r,alive:true,used:false}));
 setup.classList.add("hidden");
 queue=[];
 players.forEach(p=>queue.push(()=>showPrivate(p,"あなたの役職",p.role)));
 nextQueue();
}

/* ===== 共通 ===== */
function showConfirm(t,yes){
 confirmText.textContent=t;
 confirmBox.classList.remove("hidden");
 currentAction=yes;
}
function confirmYes(){confirmBox.classList.add("hidden");currentAction();}
function confirmNo(){alert("正しい人に渡してください");}

function showPrivate(p,title,content){
 showConfirm(`あなたは ${p.name} ですか？`,()=>{
  privateTitle.textContent=title;
  privateContent.textContent=content;
  privateBox.classList.remove("hidden");
  currentAction=()=>{privateBox.classList.add("hidden");nextQueue();}
 });
}
function privateOK(){currentAction();}
function nextQueue(){queue.length?queue.shift()():startDay();}

/* ===== 昼 ===== */
function startDay(){
 game.classList.remove("hidden");
 phase="昼";
 phaseEl.textContent="昼（投票）";
 info.textContent="処刑する人を選択";
 selected=null;
 render(true);
}

/* ===== 夜 ===== */
function startNight(){
 phase="夜";
 phaseEl.textContent="夜";
 night={};protectedId=null;
 queue=[];
 players.filter(p=>p.alive).forEach(p=>{
  if(["人狼","占い師","騎士"].includes(p.role))
   queue.push(()=>nightAction(p));
 });
 nextQueue();
}

function nightAction(p){
 showPrivate(p,"夜の行動",`${p.role} の行動を選択`);
 render(true,p);
}

/* ===== 表示 ===== */
function render(select=false,actor=null){
 playersDiv.innerHTML="";
 players.forEach(p=>{
  let d=document.createElement("div");
  d.className="player"+(!p.alive?" dead":"");
  d.textContent=p.name;
  if(select&&p.alive&&(p!==actor)){
   d.onclick=()=>{
    document.querySelectorAll(".select").forEach(e=>e.classList.remove("select"));
    d.classList.add("select");
    selected=p.id;
    if(actor)night[actor.id]=p.id;
   };
  }
  playersDiv.appendChild(d);
 });
}

/* ===== 決定 ===== */
function confirm(){
 if(phase==="昼"){
  if(selected==null)return;
  players[selected].alive=false;
  checkWin()||startNight();
 }else resolveNight();
}

/* ===== 夜結果 ===== */
function resolveNight(){
 let wolfTarget=null;
 players.forEach(p=>{
  if(p.role==="人狼")wolfTarget=night[p.id];
  if(p.role==="騎士")protectedId=night[p.id];
 });
 if(wolfTarget!=null&&wolfTarget!==protectedId){
  let t=players[wolfTarget];
  if(t.role==="踊り子"&&!t.used)t.used=true;
  else if(t.role!=="妖狐")t.alive=false;
 }
 nextQueue();
}

/* ===== 勝利 ===== */
function checkWin(){
 let alive=players.filter(p=>p.alive);
 let wolves=alive.filter(p=>p.role==="人狼").length;
 let villagers=alive.filter(p=>!["人狼","妖狐"].includes(p.role)).length;
 let fox=alive.some(p=>p.role==="妖狐");
 if(fox&&wolves===0&&villagers===0)return win("🦊 妖狐の勝利");
 if(wolves===0)return win("🎉 村人陣営の勝利");
 if(wolves>=villagers)return win("🐺 人狼陣営の勝利");
 return false;
}
function win(t){
 game.classList.add("hidden");
 result.classList.remove("hidden");
 resultText.textContent=t;
 return true;
}
</script>
</body>
</html>
