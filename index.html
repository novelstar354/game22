<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>人狼ゲーム 完全版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;text-align:center}
.card{background:#1e293b;margin:10px auto;padding:15px;border-radius:14px;max-width:420px}
.hidden{display:none}
button{width:90%;max-width:300px;padding:14px;font-size:17px;border:none;border-radius:14px;background:#22c55e;color:#000;margin:8px auto}
button:disabled{background:#475569;color:#aaa}
input{font-size:16px;padding:6px;border-radius:6px;border:none}
.player{background:#334155;margin:6px auto;padding:10px;border-radius:10px;max-width:300px}
.dead{opacity:.4;text-decoration:line-through}
.select{outline:3px solid #22c55e}
.warning{color:#f87171;font-weight:bold}
.timer{font-size:22px;font-weight:bold;color:#facc15}
</style>
</head>
<body>

<h1>🐺 人狼ゲーム</h1>

<div id="setup" class="card">
<h2>設定</h2>
人数<br><input id="pc" type="number" value="8" min="3"><br><br>
昼の制限時間（秒）<br><input id="dayLimit" type="number" value="60"><br><br>

🐺<input id="wolf" type="number" value="1">
🔮<input id="seer" type="number" value="1">
📿<input id="medium" type="number" value="1">
🛡<input id="knight" type="number" value="1">
💃<input id="dancer" type="number" value="1"><br>

<label><input type="checkbox" id="adv" onchange="advBox.classList.toggle('hidden',!this.checked);updateVillagers()">上級役職ON</label>
<div id="advBox" class="hidden">🦊<input id="fox" type="number" value="0"></div>

<h3>プレイヤー名</h3>
<div id="nameInputs"></div>
<div id="villagerCount"></div>
<div id="warn" class="warning hidden">⚠ 役職数が人数を超えています</div>
<button id="startBtn" onclick="start()">開始</button>
</div>

<div id="confirmBox" class="card hidden">
<h2 id="confirmText"></h2>
<button onclick="confirmYes()">はい</button>
<button onclick="alert('正しい人に渡してください')">いいえ</button>
</div>

<div id="privateBox" class="card hidden">
<h2 id="privateTitle"></h2>
<p id="privateContent"></p>
<button onclick="privateOK()">OK</button>
</div>

<div id="game" class="card hidden">
<h2 id="phaseEl"></h2>
<div class="timer" id="timer"></div>
<p id="info"></p>
<div id="players"></div>
<button onclick="confirm()">決定</button>
</div>

<div id="result" class="card hidden">
<h2 id="resultText"></h2>
<button onclick="location.reload()">役職選択に戻る</button>
</div>

<script>
const $=id=>document.getElementById(id);
const playersDiv=$("players");

let players=[],queue=[],phase="",night={},votes={},selected=null,actor=null;
let remain=0,dayTimer=null,lastExecuted=null;

/* 名前 */
function updateNames(){
 nameInputs.innerHTML="";
 for(let i=0;i<pc.value;i++){
  let inp=document.createElement("input");
  inp.placeholder="P"+(i+1);
  inp.style.margin="4px";
  nameInputs.appendChild(inp);
 }
}
pc.oninput=()=>{updateNames();updateVillagers();}
updateNames();

/* 村人計算 */
function updateVillagers(){
 let used=+wolf.value+ +seer.value+ +medium.value+ +knight.value+ +dancer.value+(adv.checked?+fox.value:0);
 let v=pc.value-used;
 villagerCount.textContent=`👤 村人：${Math.max(0,v)} 人`;
 warn.classList.toggle("hidden",v>=0);
 startBtn.disabled=v<0;
}
document.querySelectorAll("#setup input").forEach(i=>i.oninput=updateVillagers);
updateVillagers();

/* 開始 */
function start(){
 let names=[...nameInputs.children].map((i,n)=>i.value||"P"+(n+1));
 let roles=[];
 const add=(id,r)=>{for(let i=0;i<$(id).value;i++)roles.push(r);}
 add("wolf","人狼");add("seer","占い師");add("medium","霊能者");
 add("knight","騎士");add("dancer","踊り子");
 if(adv.checked)add("fox","妖狐");
 while(roles.length<pc.value)roles.push("村人");
 roles.sort(()=>Math.random()-.5);
 players=roles.map((r,i)=>({id:i,name:names[i],role:r,alive:true,used:false}));
 setup.classList.add("hidden");
 queue=[...players.map(p=>()=>showPrivate(p,"あなたの役職",p.role)),startDay];
 next();
}

/* 共通 */
function showConfirm(t,yes){
 confirmText.textContent=t;
 confirmBox.classList.remove("hidden");
 confirmYes=()=>{confirmBox.classList.add("hidden");yes();};
}
function showPrivate(p,t,c){
 showConfirm(`あなたは ${p.name} ですか？`,()=>{
  privateTitle.textContent=t;
  privateContent.textContent=c;
  privateBox.classList.remove("hidden");
  actor=p;
 });
}
function privateOK(){privateBox.classList.add("hidden");next();}
function next(){queue.length&&queue.shift()();}

/* 表示 */
function render(sel){
 playersDiv.innerHTML="";
 players.forEach(p=>{
  let d=document.createElement("div");
  d.className="player"+(!p.alive?" dead":"");
  d.textContent=p.name;
  if(sel&&p.alive){
   d.onclick=()=>{
    document.querySelectorAll(".select").forEach(x=>x.classList.remove("select"));
    d.classList.add("select");
    selected=p.id;
   };
  }
  playersDiv.appendChild(d);
 });
}

/* 昼 */
function startDay(){
 phase="昼";
 votes={};
 game.classList.remove("hidden");
 phaseEl.textContent="昼（処刑投票）";
 info.textContent="処刑する人を選択";
 selected=null;
 render(true);
 startTimer();
}
function startTimer(){
 clearInterval(dayTimer);
 remain=+dayLimit.value;
 timer.textContent=`残り ${remain} 秒`;
 dayTimer=setInterval(()=>{
  timer.textContent=`残り ${--remain} 秒`;
  if(remain<=0){clearInterval(dayTimer);finishVote();}
 },1000);
}
function confirm(){
 if(selected==null)return;

 if(phase==="昼"){
  votes[selected]=(votes[selected]||0)+1;
  clearInterval(dayTimer);
  finishVote(); // ★必ず処刑
 }else{
  night[actor.role]??={};
  night[actor.role][actor.id]=selected;
  next();
 }
 selected=null;
 document.querySelectorAll(".select").forEach(x=>x.classList.remove("select"));
}
function finishVote(){
 let e=Object.entries(votes);
 if(!e.length){
  let a=players.filter(p=>p.alive);
  e=[[a[Math.random()*a.length|0].id,1]];
 }
 let m=Math.max(...e.map(e=>e[1]));
 let t=e.filter(e=>e[1]===m).map(e=>+e[0]);
 let k=t[Math.random()*t.length|0];
 players[k].alive=false;
 lastExecuted=k;
 checkWin()||startNight();
}

/* 夜 */
function startNight(){
 timer.textContent="";
 phase="夜";night={};queue=[];
 players.filter(p=>p.alive&&["人狼","占い師","霊能者","騎士"].includes(p.role))
  .forEach(p=>queue.push(()=>nightAct(p)));
 queue.push(resolveNight);next();
}
function nightAct(p){
 if(p.role==="霊能者"){
  let txt=lastExecuted!=null?`${players[lastExecuted].name} は【${players[lastExecuted].role}】`:"判定なし";
  showPrivate(p,"霊能結果",txt);
 }else{
  showPrivate(p,"夜の行動",`${p.role}：対象を選択`);
  selected=null;render(true);
 }
}

/* 夜解決 */
function resolveNight(){
 let protect=night["騎士"]&&Object.values(night["騎士"])[0];

 if(night["占い師"]){
  let id=Object.values(night["占い師"])[0];
  let t=players[id];
  if(t.role==="妖狐")t.alive=false;
  queue.unshift(()=>showPrivate(players.find(p=>p.role==="占い師"),"占い結果",`${t.name} は【${t.role}】`));
 }

 if(night["人狼"]){
  let v=Object.values(night["人狼"]),c={};
  v.forEach(x=>c[x]=(c[x]||0)+1);
  let m=Math.max(...Object.values(c));
  let k=+Object.keys(c).filter(x=>c[x]===m)[0];
  if(k!==protect){
   let t=players[k];
   if(t.role==="踊り子"&&!t.used)t.used=true;
   else if(t.role!=="妖狐")t.alive=false;
  }
 }

 checkWin()||startDay();
}

/* 勝利 */
function checkWin(){
 let a=players.filter(p=>p.alive);
 let w=a.filter(p=>p.role==="人狼").length;
 let v=a.filter(p=>!["人狼","妖狐"].includes(p.role)).length;
 let f=a.some(p=>p.role==="妖狐");
 if(f&&w===0&&v===0)return win("🦊 妖狐の勝利");
 if(w===0)return win("🎉 村人陣営の勝利");
 if(w>=v)return win("🐺 人狼陣営の勝利");
}
function win(t){
 game.classList.add("hidden");
 result.classList.remove("hidden");
 resultText.textContent=t;
 return true;
}
</script>
</body>
</html>
